<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Technology School | Register</title>

  <!-- FAVICON -->
  <link rel="icon" href="src/img/logo.png">

  <!-- BOOTSTRAP -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- BOOTSTRAP ICONS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
  />

  <!-- CUSTOM CSS -->
  <link rel="stylesheet" href="src/style/style.css" />

</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">

    <div class="container">

      <!-- LOGO -->
      <a href="index.html" class="navbar-brand d-flex align-items-center gap-2">

        <img
          src="src/img/logo.png"
          alt="Technology School Logo"
          width="50"
        >

        <span class="fw-bold">
          TecSchool
        </span>

      </a>

      <!-- MOBILE BUTTON -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menu"
      >

        <span class="navbar-toggler-icon"></span>

      </button>

      <!-- MENU -->
      <div class="collapse navbar-collapse" id="menu">

        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">

          <li class="nav-item">
            <a href="index.html" class="nav-link">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a href="techn.html" class="nav-link">
              Technology
            </a>
          </li>

          <li class="nav-item">
            <a href="calendar.html" class="nav-link">
              Calendar
            </a>
          </li>

        </ul>

      </div>

    </div>

  </nav>

  <!-- REGISTER SECTION -->
  <main class="py-5 bg-light min-vh-100 d-flex align-items-center">

    <div class="container">

      <div class="row justify-content-center">

        <div class="col-lg-10">

          <div class="card shadow border-0 rounded-4 p-4">

            <div class="card-body">

              <!-- TITLE -->
              <div class="text-center mb-4">

                <h2 class="fw-bold">
                  SIGN UP
                </h2>

                <p class="text-secondary">
                  Create your account
                </p>

              </div>

              <!-- FORM -->
              <form id="signup-form">

                <!-- EMAIL -->
                <div class="mb-3">

                  <label class="form-label">
                    E-mail
                  </label>

                  <input
                    type="email"
                    class="form-control"
                    placeholder="Enter your e-mail"
                    name="email"
                    required
                  />

                </div>

                <!-- PASSWORD -->
                <div class="mb-3">

                  <label class="form-label">
                    Password
                  </label>

                  <input
                    type="password"
                    class="form-control"
                    placeholder="Enter your password"
                    name="password"
                    required
                  />

                </div>

                <!-- CONFIRM PASSWORD -->
                <div class="mb-4">

                  <label class="form-label">
                    Confirm Password
                  </label>

                  <input
                    type="password"
                    class="form-control"
                    placeholder="Confirm your password"
                    name="confirmPassword"
                    required
                  />

                </div>

                <!-- BUTTON -->
                <div class="d-grid">

                  <button type="submit" class="btn btn-primary py-2">
                    Sign Up
                  </button>

                </div>

                <!-- LOGIN -->
                <div class="text-center mt-4">

                  <p class="mb-0">
                    Already have an account?
                    <a href="login.html" class="text-decoration-none">
                      Login
                    </a>
                  </p>

                </div>

              </form>

            </div>

          </div>

        </div>

      </div>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-dark text-white py-4">

    <div class="container">

      <div class="row align-items-center text-center text-lg-start g-4">

        <!-- SOCIAL -->
        <div class="col-lg-4">

          <div class="d-flex justify-content-center justify-content-lg-start gap-3">

            <a href="#" class="text-white fs-4">
              <i class="bi bi-instagram"></i>
            </a>

            <a href="#" class="text-white fs-4">
              <i class="bi bi-facebook"></i>
            </a>

            <a href="#" class="text-white fs-4">
              <i class="bi bi-linkedin"></i>
            </a>

            <a href="#" class="text-white fs-4">
              <i class="bi bi-youtube"></i>
            </a>

          </div>

        </div>

        <!-- COPYRIGHT -->
        <div class="col-lg-4 text-center">

          <p class="mb-0">
            © 2026 TecSchool. All rights reserved.
          </p>

        </div>

        <!-- LOGO -->
        <div class="col-lg-4 text-center text-lg-end">

          <img
            src="src/img/logo.png"
            alt="TecSchool Logo"
            width="60"
          >

        </div>

      </div>

    </div>

  </footer>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- REGISTER JS -->
  <script type="module" src="src/script/register.js"></script>

</body>

</html>

<body>

   <!---- NAVBAR ---->

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">

    <div class="container">

      <!-- LOGO -->
      <a href="index.html" class="navbar-brand d-flex align-items-center gap-2">

        <img
          src="src/img/logo.png"
          alt="Technology School Logo"
          width="50">

        <span class="fw-bold">
          TecSchool
        </span>

      </a>

      <!-- MOBILE BUTTON -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menu">

        <span class="navbar-toggler-icon"></span>

      </button>

      <!-- MENU -->
      <div class="collapse navbar-collapse" id="menu">

        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">

          <li class="nav-item">
            <a href="index.html" class="nav-link">

        </ul>

      </div>

    </div>

  </nav>

  <!-- LOGIN SECTION -->
<main class="py-5 bg-light min-vh-100 d-flex align-items-center">

  <div class="container">

    <div class="row justify-content-center">

      <!-- LOGIN CARD -->
      <div class="col-lg-10">

        <div class="card shadow border-0 rounded-4 p-4">

          <div class="card-body">

            <!-- TITLE -->
            <div class="text-center mb-4">

              <h2 class="fw-bold">
                LOGIN
              </h2>

              <p class="text-secondary">
                Access your account
              </p>

            </div>

            <!-- FORM -->
            <form id="loginForm">

              <!-- EMAIL -->
              <div class="mb-3">

                <label class="form-label">
                  E-mail
                </label>

                <input
                  type="email"
                  id="email"
                  class="form-control"
                  placeholder="Enter your e-mail"
                  required
                />

              </div>

              <!-- PASSWORD -->
              <div class="mb-4">

                <label class="form-label">
                  Password
                </label>

                <input
                  type="password"
                  id="password"
                  class="form-control"
                  placeholder="Enter your password"
                  required
                />

              </div>

              <!-- BUTTON -->
              <div class="d-grid">

                <button type="submit" class="btn btn-primary py-2">
                  Login
                </button>

              </div>

              <!-- REGISTER -->
              <div class="text-center mt-4">

                <p class="mb-0">
                  Don’t have an account?
                  <a href="/register.html" class="text-decoration-none">
                    Sign up
                  </a>
                </p>

              </div>

            </form>

          </div>

        </div>

      </div>

    </div>

  </div>

</main>

  <!----FOOTER---->

        <!-- COPYRIGHT -->
        <div class="col-lg-4 text-center">

          <p class="mb-0">
            © 2026 TecSchool. All rights reserved.
          </p>

        </div>

        <!-- LOGO -->
        <div class="col-lg-4 text-center text-lg-end">

          <img
            src="src/img/logo.png"
            alt="TecSchool Logo"
            width="60">

        </div>

      </div>

    </div>

  </footer>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Technology School | Login</title>

  <!-- FAVICON -->
  <link rel="icon" href="src/tec.ico" />

  <!-- BOOTSTRAP -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- CUSTOM CSS -->
  <link rel="stylesheet" href="src/style/style.css" />
</head>

<body>

  <!-- HEADER -->
  <header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">

      <div class="container">

        <!-- LOGO -->
        <a class="navbar-brand" href="#">
          <img src="src/img/logo.png" alt="TecSchool Logo" width="140" />
        </a>

        <!-- MOBILE BUTTON -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarMenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- MENU -->
        <div class="collapse navbar-collapse" id="navbarMenu">

          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">

            <li class="nav-item">
              <a class="nav-link" href="/index.html">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="/techn.html">Technology</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="/calendar.html">Calendar</a>
            </li>

            <li class="nav-item">
              <a class="btn btn-primary px-4 active" href="/login.html">
                Login
              </a>
            </li>

          </ul>

        </div>

      </div>

    </nav>

  </header>

  <!-- LOGIN SECTION -->
  <main class="py-5 bg-light min-vh-100 d-flex align-items-center">

    <div class="container">

      <div class="row justify-content-center">

        <div class="col-lg-5 col-md-8">

          <div class="card shadow border-0 rounded-4 p-4">

            <div class="card-body">

              <!-- TITLE -->
              <div class="text-center mb-4">

                <h2 class="fw-bold">
                  LOGIN
                </h2>

                <p class="text-secondary">
                  Access your account
                </p>

              </div>

              <!-- FORM -->
              <form
                method="post"
                action="/src/php/log.php"
                class="formlogin"
                name="formlogin"
              >

                <!-- EMAIL -->
                <div class="mb-3">

                  <label class="form-label">
                    E-mail
                  </label>

                  <input
                    type="email"
                    class="form-control"
                    placeholder="Enter your e-mail"
                    name="email"
                    required
                  />

                </div>

                <!-- PASSWORD -->
                <div class="mb-4">

                  <label class="form-label">
                    Password
                  </label>

                  <input
                    type="password"
                    class="form-control"
                    placeholder="Enter your password"
                    name="password"
                    required
                  />

                </div>

                <!-- BUTTON -->
                <div class="d-grid">

                  <button type="submit" class="btn btn-primary py-2">
                    Login
                  </button>

                </div>

                <!-- REGISTER -->
                <div class="text-center mt-4">

                  <p class="mb-0">
                    Don’t have an account?
                    <a href="/register.html" class="text-decoration-none">
                      Sign up
                    </a>
                  </p>

                </div>

              </form>

            </div>

          </div>

        </div>

      </div>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-dark text-white py-4">

    <div class="container">

      <div class="row align-items-center text-center text-md-start">

        <!-- SOCIAL -->
        <div class="col-md-6 mb-3 mb-md-0">

          <div class="d-flex justify-content-center justify-content-md-start gap-3">

            <a href="#">
              <img src="/src/icons/insta.svg" alt="Instagram" width="30" />
            </a>

            <a href="#">
              <img src="/src/icons/face.svg" alt="Facebook" width="30" />
            </a>

            <a href="#">
              <img src="/src/icons/link.svg" alt="LinkedIn" width="30" />
            </a>

            <a href="#">
              <img src="/src/icons/yt.svg" alt="YouTube" width="30" />
            </a>

          </div>

        </div>

        <!-- LOGO -->
        <div class="col-md-6 text-center text-md-end">

          <img src="src/img/logo.png" alt="TecSchool Logo" width="140" />

        </div>

      </div>

    </div>

  </footer>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- CUSTOM JS -->
  <script src="src/script/script.js"></script>

</body>

</html>
